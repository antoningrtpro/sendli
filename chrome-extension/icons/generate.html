<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Générer les icônes Sendli</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 40px; background: #f9fafb; color: #111827; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: #6b7280; margin-bottom: 24px; }
    #canvases { display: flex; gap: 24px; align-items: flex-end; margin-bottom: 32px; }
    .icon-wrap { text-align: center; }
    .icon-wrap canvas { display: block; border-radius: 20%; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .icon-wrap span { display: block; margin-top: 6px; font-size: 12px; color: #9ca3af; }
    button {
      padding: 10px 24px; background: #4f46e5; color: #fff;
      border: none; border-radius: 999px; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #status { margin-top: 16px; font-size: 13px; color: #059669; }
  </style>
</head>
<body>
  <h1>Générer les icônes Sendli</h1>
  <p>Cliquez sur "Télécharger toutes les icônes" pour générer et télécharger les 4 tailles PNG requises par l'extension.</p>
  <div id="canvases"></div>
  <button id="btn-download">Télécharger toutes les icônes</button>
  <p id="status"></p>

  <script>
    const SIZES = [16, 32, 48, 128];
    const container = document.getElementById('canvases');

    function drawIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const r = size / 2;

      // Background circle — indigo gradient
      const grad = ctx.createRadialGradient(r * 0.9, r * 0.7, 0, r, r, r);
      grad.addColorStop(0, '#6366f1');
      grad.addColorStop(1, '#3730a3');
      ctx.beginPath();
      ctx.arc(r, r, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // White "S"
      ctx.fillStyle = '#ffffff';
      ctx.font = `700 ${Math.round(size * 0.58)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', r, r + size * 0.03);

      return canvas;
    }

    // Preview
    SIZES.forEach(size => {
      const wrap = document.createElement('div');
      wrap.className = 'icon-wrap';
      const canvas = drawIcon(size);
      const label = document.createElement('span');
      label.textContent = `${size}×${size}`;
      wrap.appendChild(canvas);
      wrap.appendChild(label);
      container.appendChild(wrap);
    });

    document.getElementById('btn-download').addEventListener('click', () => {
      SIZES.forEach((size, i) => {
        setTimeout(() => {
          const canvas = drawIcon(size);
          const a = document.createElement('a');
          a.download = `icon-${size}.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        }, i * 150);
      });
      document.getElementById('status').textContent =
        '✅ Téléchargement en cours… Placez les fichiers dans le dossier chrome-extension/icons/';
    });
  </script>
</body>
</html>
