<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Sendli</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Setup screen ──────────────────────────────────────────────────────── -->
  <div id="screen-setup" class="screen">
    <div class="setup-wrap">
      <div class="setup-logo-wrap">
        <img src="logo.png" alt="Sendli" class="setup-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="setup-logo-fallback">S</div>
      </div>
      <h1 class="setup-title">Connectez votre compte</h1>
      <p class="setup-desc">Générez un token dans vos <a id="link-settings" href="#" class="link">paramètres Sendli</a> et collez-le ci-dessous.</p>
      <div class="field-group">
        <label class="field-label">Token d'accès</label>
        <input id="setup-token" type="text" class="field-input mono" placeholder="Votre token…" autocomplete="off" spellcheck="false" />
      </div>
      <button id="btn-connect" class="btn-primary w-full">Connecter</button>
    </div>
  </div>

  <!-- ── Main screen ───────────────────────────────────────────────────────── -->
  <div id="screen-main" class="screen hidden">

    <!-- Header -->
    <div class="topbar">
      <img src="logo.png" alt="Sendli" class="topbar-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="topbar-logo-fallback hidden">Sendli</span>
      <div class="topbar-actions">
        <button id="btn-new-proposal" class="btn-primary btn-sm">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nouvelle propale
        </button>
        <button id="btn-settings-open" class="icon-btn" title="Paramètres">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <button class="tab active" data-tab="unread">
        Non lues
        <span id="badge-unread" class="tab-badge hidden">0</span>
      </button>
      <button class="tab" data-tab="read">Lues</button>
      <button id="btn-mark-all" class="tab-action" title="Tout marquer comme lu">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Tout lire
      </button>
    </div>

    <!-- List -->
    <div id="notif-list" class="notif-list">
      <div class="state-loading">
        <div class="spinner"></div>
      </div>
    </div>

  </div>

  <!-- ── Settings overlay ──────────────────────────────────────────────────── -->
  <div id="screen-settings" class="screen hidden">
    <div class="overlay-topbar">
      <button id="btn-settings-back" class="icon-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="overlay-title">Paramètres</span>
    </div>
    <div class="overlay-body">
      <div class="field-group">
        <label class="field-label">Token d'accès</label>
        <input id="settings-token" type="text" class="field-input mono" placeholder="Votre token…" autocomplete="off" spellcheck="false"/>
        <p class="field-hint">Générez votre token dans Paramètres → Extension Chrome</p>
      </div>
      <div class="overlay-actions">
        <button id="btn-settings-save" class="btn-primary">Enregistrer</button>
        <button id="btn-disconnect" class="btn-ghost btn-danger">Déconnecter</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
