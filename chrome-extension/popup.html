<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sendli</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Setup screen ─────────────────────────────────────────────────── -->
  <div id="screen-setup" class="screen">
    <div class="setup-container">
      <div class="setup-logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#4f46e5"/>
          <text x="20" y="27" text-anchor="middle" fill="white" font-size="22" font-family="system-ui, sans-serif" font-weight="700">S</text>
        </svg>
      </div>
      <h1 class="setup-title">Sendli</h1>
      <p class="setup-subtitle">Connectez votre compte</p>
      <p class="setup-hint">
        Copiez votre token depuis
        <a href="#" id="link-settings" class="link">vos paramètres Sendli</a>
        et collez-le ci-dessous.
      </p>
      <div class="setup-field">
        <input
          type="text"
          id="setup-token"
          class="token-input"
          placeholder="Votre token d'accès…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <div class="setup-field">
        <input
          type="text"
          id="setup-url"
          class="token-input"
          placeholder="URL de l'app (ex: https://app.sendli.fr)"
          autocomplete="off"
        />
      </div>
      <button id="btn-connect" class="btn-primary btn-full">Connecter</button>
    </div>
  </div>

  <!-- ── Main screen ──────────────────────────────────────────────────── -->
  <div id="screen-main" class="screen hidden">

    <!-- Header -->
    <div class="header">
      <div class="header-logo">
        <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#4f46e5"/>
          <text x="20" y="27" text-anchor="middle" fill="white" font-size="22" font-family="system-ui, sans-serif" font-weight="700">S</text>
        </svg>
        <span class="header-brand">Sendli</span>
      </div>
      <div class="header-actions">
        <button id="btn-new-proposal" class="btn-primary btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Nouvelle propale
        </button>
        <button id="btn-settings-open" class="icon-btn" title="Paramètres">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <button class="tab active" data-tab="unread">
        Non lues <span id="badge-unread" class="tab-badge hidden"></span>
      </button>
      <button class="tab" data-tab="read">Lues</button>
      <button id="btn-mark-all" class="tab-action" title="Tout marquer comme lu">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Tout lire
      </button>
    </div>

    <!-- Notification list -->
    <div id="notif-list" class="notif-list">
      <div class="loading-state">
        <div class="spinner"></div>
      </div>
    </div>

  </div>

  <!-- ── Settings overlay ─────────────────────────────────────────────── -->
  <div id="screen-settings" class="screen hidden">
    <div class="overlay-header">
      <button id="btn-settings-back" class="icon-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="overlay-title">Paramètres</span>
    </div>
    <div class="overlay-body">
      <div class="form-group">
        <label class="form-label">Token d'accès</label>
        <input type="text" id="settings-token" class="token-input" placeholder="Votre token…" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="form-group">
        <label class="form-label">URL de l'application</label>
        <input type="text" id="settings-url" class="token-input" placeholder="https://app.sendli.fr"/>
      </div>
      <div class="form-actions">
        <button id="btn-settings-save" class="btn-primary">Enregistrer</button>
        <button id="btn-disconnect" class="btn-danger">Déconnecter</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
